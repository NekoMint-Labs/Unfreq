services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: unfreq
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    volumes:
      - api-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - api-redis-data:/data

volumes:
  api-postgres-data:
  api-redis-data:
