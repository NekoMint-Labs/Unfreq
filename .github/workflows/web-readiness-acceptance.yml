name: Web readiness acceptance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  production-browser:
    name: Web readiness production browser
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      API_INTERNAL_BASE_URL: "http://127.0.0.1:4200"
      NEXT_PUBLIC_API_BASE_URL: "http://127.0.0.1:4200"
      PLAYWRIGHT_JSON_OUTPUT_FILE: "test-results/web-readiness-browser.json"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify Caddy routing and the HTTPS upstream policy
        run: node --test tests/deployment/caddy-web-proto.test.mjs
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Build the production Web application
        run: npm run web:build
      - name: Verify the production browser
        run: npx --no-install playwright test --config playwright.runtime.config.ts --reporter=github,json
      - name: Preserve browser reports and failure evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: web-readiness-production-browser
          if-no-files-found: warn
          path: |
            test-results/web-readiness-caddy.json
            test-results/web-readiness-browser.json
            test-results/runtime/**
