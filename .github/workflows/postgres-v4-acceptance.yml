name: PostgreSQL v4 acceptance

on:
  pull_request:
    paths:
      - ".github/workflows/postgres-v4-acceptance.yml"
      - "Dockerfile.api"
      - "Dockerfile.web"
      - "package.json"
      - "package-lock.json"
      - "apps/api/package.json"
      - "patches/**"
      - "scripts/apply-postgres-*.mjs"
      - "scripts/integration-runtime.mjs"
      - "tests/integration/postgres-*.mjs"
      - "tests/integration/patch-install.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgres-v4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node-boundaries:
    name: PostgreSQL Node ${{ matrix.node }} loading
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["20.19.0", "22.12.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Real Node module loading and guarded patch installation
        run: node --test tests/integration/postgres-module.test.mjs tests/integration/patch-install.test.mjs
      - name: Compare official unpatched package with the local lifecycle patch
        run: node tests/integration/postgres-retirement-probe.mjs
      - name: Preserve the retirement decision and natural settlement observations
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v7.0.1
        with:
          name: postgres-retirement-node-${{ matrix.node }}
          path: test-results/postgres-retirement.json
          if-no-files-found: error

  docker-dependencies:
    name: PostgreSQL ${{ matrix.component }} ${{ matrix.stage }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        component: [api, web]
        stage: [deps, prod-deps]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build the actual Dockerfile dependency stage
        run: docker build --progress plain --target ${{ matrix.stage }} -f Dockerfile.${{ matrix.component }} -t unfreq-postgres-dependencies:check .
      - name: Verify Linux patch hashes and real ESM/CommonJS/Drizzle loading
        run: |
          docker image inspect unfreq-postgres-dependencies:check --format '{{.Id}} {{.Os}} {{.Architecture}}'
          docker run --rm --entrypoint node --mount "type=bind,src=$PWD/tests/integration/postgres-docker-probe.mjs,dst=/tmp/postgres-docker-probe.mjs,readonly" unfreq-postgres-dependencies:check /tmp/postgres-docker-probe.mjs

  rollback-main:
    name: Isolated legacy PostgreSQL driver regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rollback
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: e5b459cf0e067fa391befb095bf3e87b9370cc41
          path: rollback
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: rollback/package-lock.json
      - name: Verify exact rollback revision
        run: test "$(git rev-parse HEAD)" = "e5b459cf0e067fa391befb095bf3e87b9370cc41"
      - name: Normal old-driver installation
        run: npm ci
      - name: Verify all four legacy patch hashes and idempotence
        run: node --test tests/integration/patch-install.test.mjs
      - name: Complete old-driver real PostgreSQL and Redis regression
        run: npm run api:integration
      - name: Read back old-driver result and cleanup
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFile, readdir } from "node:fs/promises";
          const runs = (await readdir("test-results/integration")).filter((name) => /^run-[A-Za-z0-9]{6}$/.test(name));
          assert.equal(runs.length, 1);
          const manifest = JSON.parse(await readFile(`test-results/integration/${runs[0]}/manifest.json`, "utf8"));
          console.log(JSON.stringify({ run: runs[0], ...manifest }));
          assert.equal(manifest.cleaned, true);
          assert.equal(manifest.exitCode, 0);
          assert.deepEqual(manifest.tests, { total: 66, passed: 66, failed: 0, pending: 0, todo: 0 });
          NODE
