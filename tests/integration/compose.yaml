services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    environment:
      POSTGRES_DB: unfreq_integration
      POSTGRES_USER: unfreq_test
      POSTGRES_PASSWORD: unfreq_integration_only
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U unfreq_test -d unfreq_integration"]
      interval: 1s
      timeout: 3s
      retries: 45
    restart: "no"

  redis:
    image: redis:7-alpine@sha256:6ba19c50b56777f5c11c58eff8ddb69d0d5f27ba131cffb63f180ccfd43c66af
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1::6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
    restart: "no"
